# Validation-only agent aliases for the deepscaleR + AIME experiment.
#
# NeMo-Gym keys its rollout metrics by `agent_ref["name"]`
# (`{agent_name}/reward/mean`, see run_async_nemo_gym_rollout). A single
# validation file whose records all name `math_with_judge_simple_agent`
# therefore collapses into ONE accuracy number. Giving each validation subset
# its own agent name is what makes aime24 / aime25 / aime26 / deepscaler-5%
# report separately from one validation pass.
#
# Every alias is a plain `simple_agent` bound to the SAME `math_with_judge`
# resources server as the training agent, so the verifier (math_verify, judge
# off) is bit-identical across all of them -- only the label differs.
#
# Requires math_with_judge.yaml to be loaded alongside this file: the
# `resources_server` reference below resolves against it.

aime24_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model

aime25_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model

aime26_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
